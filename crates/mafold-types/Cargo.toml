[package]
name = "mafold-types"
version = "0.1.0"
edition = "2021"
description = "Shared wire/protocol model for Mafold (Account/Conversation/Message/Attachment/events). One definition used by the backend (mafold-api) and available to the client core — the unified data model."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# This crate just DEFINES the wire shapes — no UUID generation, no clock — so:
# uuid without "v4" (no getrandom) and chrono without "clock"/default (no
# wasmbind). Keeps it lean + wasm-clean so the client core can depend on it.
uuid = { version = "1", default-features = false, features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde"] }
# The digest a provider pack's signature covers. Lives here rather than in the
# core or the api because signer and verifier must hash IDENTICAL bytes, and the
# only way to guarantee that is one function in the crate both depend on.
# Pure computation, no getrandom — the crate stays wasm-clean.
sha2 = { version = "0.10", default-features = false }
