[package]
name = "mafold-cli"
version = "0.9.70"
edition = "2021"
description = "Mafold from your terminal — a CLI client (chats / send) + a Claude Code agent daemon."
license = "MIT"

[[bin]]
name = "mafold"
path = "src/main.rs"

[dependencies]
# The shared client core: validated RPC transport (methods registry — a method-
# name typo dies locally, not as a server 404), typed methods over the
# mafold-types wire model (re-exported), and the pooled HTTP client every other
# client uses. Same-language consumer: no FFI, plain crate dep.
mafold-core = { path = "../mafold-core" }
uuid = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util", "signal"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
sha2 = "0.10"
# Shared-room CRDT peer for the AI: same crate/version the API uses
# (compact_room_log), so change blobs interop with web's @automerge/automerge.
automerge = "0.5"
base64 = "0.22"

# Process/session control (detach via setsid, liveness + stop via signals) — Unix only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Native Win32 for the same primitives: OpenProcess/TerminateProcess (liveness +
# stop), DETACHED_PROCESS creation flags (detach), LockFileEx (update lock), and
# GetConsoleWindow/ShowWindow (hide the console the logon task hands the
# supervisor — see platform::hide_console).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Globalization",
] }
