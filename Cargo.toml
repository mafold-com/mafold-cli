[package]
name = "mafold-cli"
version = "0.9.25"
edition = "2021"
description = "Mafold from your terminal — a CLI client (chats / send) + a Claude Code agent daemon."
license = "MIT"

[[bin]]
name = "mafold"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
sha2 = "0.10"

# Process/session control (detach via setsid, liveness + stop via signals) — Unix only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Native Win32 for the same primitives: OpenProcess/TerminateProcess (liveness +
# stop), DETACHED_PROCESS creation flags (detach), and LockFileEx (update lock).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
