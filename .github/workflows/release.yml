name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - run: cp "target/${{ matrix.target }}/release/mafold" "mafold-${{ matrix.target }}"
      # Per-asset checksum (the matrix can't share one SHA256SUMS file); the
      # updater verifies the binary against this before swapping it in.
      - run: shasum -a 256 "mafold-${{ matrix.target }}" | awk '{print $1}' > "mafold-${{ matrix.target }}.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            mafold-${{ matrix.target }}
            mafold-${{ matrix.target }}.sha256
