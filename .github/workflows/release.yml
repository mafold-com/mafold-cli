name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the release ONCE, up front, so the per-target build jobs only ever
  # UPLOAD to it. Previously every matrix job ran action-gh-release and raced to
  # CREATE the same release; the losers failed to finalize the tag
  # ("already_exists: tag_name") and silently dropped their asset (v0.9.8 lost
  # the linux binary that way). Idempotent: skips if the release already exists
  # (re-runs, or a tag re-push).
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "$TAG" --notes "Automated release $TAG."

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - run: cp "target/${{ matrix.target }}/release/mafold" "mafold-${{ matrix.target }}"
      # Per-asset checksum (the matrix can't share one SHA256SUMS file); the
      # updater verifies the binary against this before swapping it in.
      - run: shasum -a 256 "mafold-${{ matrix.target }}" | awk '{print $1}' > "mafold-${{ matrix.target }}.sha256"
      # Upload to the pre-created release. No create here → no race. --clobber
      # makes a re-run replace its own asset instead of failing.
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" \
            "mafold-${{ matrix.target }}" \
            "mafold-${{ matrix.target }}.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
