name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the release ONCE, up front, so the per-target build jobs only ever
  # UPLOAD to it. Previously every matrix job ran action-gh-release and raced to
  # CREATE the same release; the losers failed to finalize the tag
  # ("already_exists: tag_name") and silently dropped their asset (v0.9.8 lost
  # the linux binary that way). Idempotent: skips if the release already exists
  # (re-runs, or a tag re-push).
  create-release:
    runs-on: ubuntu-latest
    steps:
      # Create it as a DRAFT — a draft fires no `published` webhook and is excluded
      # from releases/latest, so neither the instant cliUpdate path nor the poll
      # see it until the `publish` job (below) flips it live with assets attached.
      - name: Ensure the release exists (draft)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
                 --title "$TAG" --notes "Automated release $TAG."

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            bin: mafold
          - target: x86_64-apple-darwin
            os: macos-latest
            bin: mafold
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: mafold
          # The Windows binary is mafold.exe; the asset keeps the extension-less
          # `mafold-<target>` name so the updater's lookup (mafold-{triple}) matches.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: mafold.exe
    runs-on: ${{ matrix.os }}
    # bash on every runner (windows-latest has Git Bash) so cp/shasum/awk/gh work
    # uniformly — the default shell on windows-latest is pwsh, which lacks them.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - run: cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "mafold-${{ matrix.target }}"
      # Per-asset checksum (the matrix can't share one SHA256SUMS file); the
      # updater verifies the binary against this before swapping it in. macOS has
      # `shasum` (no coreutils); Linux + Windows Git Bash have `sha256sum` (no
      # `shasum`). Use whichever exists — both print "<hash>  <file>".
      - run: |
          f="mafold-${{ matrix.target }}"
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "$f"; else shasum -a 256 "$f"; fi | awk '{print $1}' > "$f.sha256"
      # Upload to the pre-created release. No create here → no race. --clobber
      # makes a re-run replace its own asset instead of failing.
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" \
            "mafold-${{ matrix.target }}" \
            "mafold-${{ matrix.target }}.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

  # Flip the draft live ONLY after every asset is uploaded, so the GitHub `release`
  # `published` webhook (→ api /githubWebhook → events.cliUpdate → daemons update)
  # fires when the binaries actually exist. Otherwise the instant update races an
  # empty release and falls back to the 10-min poll.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
